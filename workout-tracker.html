<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101010; --surface:#1a1a1a; --surface2:#212121; --chalk:#F1EEE7; --muted:#84837f;
    --accent:#F2C744; --run:#6FB6E8; --done:#4CAF77; --note:#9B8FE0; --border:#272727;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, [role="button"]{-webkit-appearance:none; appearance:none; -webkit-touch-callout:none;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--chalk); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:100px;}
  .display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .topbar{display:flex; justify-content:space-between; align-items:center; padding:20px 20px 4px;}
  .topbar .brand{font-size:12px; letter-spacing:0.18em; color:var(--muted); font-weight:600;}
  .topbar button{background:none; border:1px solid var(--border); color:var(--chalk); font-family:'Inter',sans-serif; font-size:11.5px; padding:6px 11px; border-radius:20px; cursor:pointer;}
  .topbar button:active{background:var(--surface2);}

  .datehead{display:flex; align-items:center; justify-content:space-between; padding:8px 14px 4px;}
  .datehead button{background:none;border:none;color:var(--muted);font-size:22px;padding:6px 10px;cursor:pointer;line-height:1;}
  .datehead .dateinfo{text-align:center; flex:1;}
  .datehead .dow{font-size:26px; font-weight:700; line-height:1.1;}
  .datehead .full{font-size:11.5px; color:var(--muted); margin-top:1px; letter-spacing:0.04em;}
  .relTag{display:inline-block; margin-top:6px; font-size:10.5px; padding:3px 9px; border-radius:10px; font-weight:700; letter-spacing:0.02em;}
  .relTag.now{background:var(--accent); color:#1a1400;}
  .relTag.near{background:var(--surface2); color:var(--muted); border:1px solid var(--border);}
  .jumpToday{background:none; border:1px solid var(--border); color:var(--accent); font-family:'Inter',sans-serif; font-size:11.5px; padding:6px 11px; border-radius:20px; cursor:pointer;}

  .weekstrip{display:flex; gap:6px; padding:10px 16px 14px; overflow-x:auto;}
  .daychip{flex:1 0 40px; min-width:40px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 2px; text-align:center; cursor:pointer;}
  .daychip.sel{background:var(--accent); border-color:var(--accent);}
  .daychip.sel .cl,.daychip.sel .cn{color:#1a1400;}
  .daychip .cl{font-size:9.5px; color:var(--muted); letter-spacing:0.04em;}
  .daychip .cn{font-size:14px; font-weight:700; margin-top:2px;}
  .daychip .marks{display:flex; justify-content:center; gap:3px; margin-top:5px; height:5px;}
  .marks span{width:4px;height:4px;border-radius:50%;}

  .progresswrap{padding:2px 20px 16px;}
  .progressbar{height:5px; background:var(--surface2); border-radius:3px; overflow:hidden;}
  .progressbar > div{height:100%; background:var(--accent); border-radius:3px; transition:width 0.25s;}
  .progresslabel{font-size:11.5px; color:var(--muted); margin-top:6px;}

  .list{padding:0 16px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:40px 20px;}

  .item{display:flex; align-items:flex-start; gap:6px; padding:9px 6px; border-bottom:1px solid var(--border);}
  .item.indent{padding-left:26px;}
  .checkbtn{background:none; border:none; padding:11px; margin:-9px -4px -9px -11px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .checkbox{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent; pointer-events:none;}
  .checkbox.on{background:var(--done); border-color:var(--done); color:#0c1f14;}
  .noteicon{width:22px; height:22px; flex-shrink:0; margin:2px 4px 0 0; display:flex; align-items:center; justify-content:center; color:var(--note); font-size:13px;}
  .itembody{flex:1; min-width:0; cursor:pointer; padding:2px 0;}
  .itemtitle{font-size:14.5px; line-height:1.35;}
  .itemtitle.struck{color:var(--muted); text-decoration:line-through;}
  .itemtitle.notetext{color:var(--chalk); font-style:italic;}
  .itemtag{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; color:var(--muted); margin-top:3px;}
  .dotk{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .dot-lift{background:var(--accent);} .dot-run{background:var(--run);} .dot-note{background:var(--note);} .dot-todo{background:var(--chalk);}
  .delbtn{background:none;border:none;color:var(--muted);font-size:19px;padding:11px;margin:-11px -11px -11px 0;cursor:pointer;flex-shrink:0;}

  .fab{position:fixed; right:20px; bottom:28px; width:56px; height:56px; border-radius:50%; background:var(--accent); color:#1a1400; border:none; font-size:28px; font-weight:400; box-shadow:0 6px 20px rgba(0,0,0,0.4); cursor:pointer; z-index:40; display:flex; align-items:center; justify-content:center;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 20px 28px; max-height:82vh; overflow-y:auto; border:1px solid var(--border); border-bottom:none;}
  .modal h3{margin:0 0 4px; font-size:18px;}
  .modal .sub{color:var(--muted); font-size:13px; margin-bottom:16px;}
  .modal-close{float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;}
  .typechips{display:flex; gap:8px; margin-bottom:12px;}
  .typechip{flex:1; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); font-size:13px; cursor:pointer; color:var(--muted);}
  .typechip.sel{border-color:var(--accent); color:var(--accent); background:#2a2410;}
  input[type=text], textarea{width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--chalk); border-radius:10px; padding:11px; font-family:'Inter',sans-serif; font-size:14px; resize:none;}
  .save-bar{position:sticky; bottom:0; background:var(--surface); padding-top:14px; margin-top:6px; display:flex; gap:8px;}
  .save-btn{flex:1; background:var(--accent); color:#1a1400; border:none; border-radius:12px; padding:13px; font-weight:700; font-size:14px; cursor:pointer;}
  .save-btn.danger{background:transparent; border:1px solid #E15252; color:#E15252;}

  .editor-row{display:flex; gap:8px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--border);}
  .editor-row .ename{width:40px; font-size:13px; color:var(--muted); flex-shrink:0;}
  .editor-row select{background:var(--surface2); color:var(--chalk); border:1px solid var(--border); border-radius:8px; padding:8px; font-size:13px; flex:1;}
  .editor-row input[type=text]{background:var(--surface2); color:var(--chalk); border:1px solid var(--border); border-radius:8px; padding:8px; font-size:13px; flex:2; min-width:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">DAILY</div>
  <div style="display:flex; gap:8px;">
    <button id="jumpToday" class="jumpToday" style="display:none;">Today</button>
    <button id="editTemplateBtn">Recurring workouts</button>
  </div>
</div>

<div class="datehead">
  <button id="prevDay">‹</button>
  <div class="dateinfo">
    <div class="dow display" id="dowLabel">—</div>
    <div class="full mono" id="fullLabel">—</div>
    <span class="relTag" id="relTag" style="display:none;"></span>
  </div>
  <button id="nextDay">›</button>
</div>

<div class="weekstrip" id="weekStrip"></div>

<div class="progresswrap">
  <div class="progressbar"><div id="progressFill" style="width:0%;"></div></div>
  <div class="progresslabel" id="progressLabel">Nothing yet</div>
</div>

<div class="list" id="list"></div>

<button class="fab" id="addFab">+</button>

<div class="overlay" id="addOverlay">
  <div class="modal">
    <button class="modal-close" id="closeAdd">×</button>
    <h3>Add to <span id="addDateLabel"></span></h3>
    <div class="sub">Todos get a checkbox. Notes are just for reference.</div>
    <div class="typechips">
      <div class="typechip sel" id="chipTodo">Todo</div>
      <div class="typechip" id="chipNote">Note</div>
    </div>
    <input type="text" id="addText" placeholder="What's on your mind?">
    <div class="save-bar"><button class="save-btn" id="saveAddBtn">Add</button></div>
  </div>
</div>

<div class="overlay" id="editOverlay">
  <div class="modal">
    <button class="modal-close" id="closeEdit">×</button>
    <h3>Edit</h3>
    <input type="text" id="editText" placeholder="Text">
    <div class="save-bar">
      <button class="save-btn danger" id="deleteBtn">Delete</button>
      <button class="save-btn" id="saveEditBtn">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="templateOverlay">
  <div class="modal">
    <button class="modal-close" id="closeTemplate">×</button>
    <h3>Recurring workouts</h3>
    <div class="sub">These repeat every week automatically — the same days, every time, until you change them here.</div>
    <div id="templateEditor" style="margin:0 -20px;"></div>
    <div class="save-bar"><button class="save-btn" id="saveTemplateBtn">Save</button></div>
  </div>
</div>

<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const LIFT_TYPES = ['Push','Pull','Legs','Upper','Lower','Rest','Full Body','Custom'];
const DEFAULT_TEMPLATE = {
  Monday:    { lift:'Push',  run:'20–30 min Zone 2, after lifting' },
  Tuesday:   { lift:'Pull',  run:'' },
  Wednesday: { lift:'Legs',  run:'' },
  Thursday:  { lift:'Rest',  run:'30–45 min Zone 2' },
  Friday:    { lift:'Upper', run:'20–30 min Zone 2, after lifting' },
  Saturday:  { lift:'Lower', run:'' },
  Sunday:    { lift:'Rest',  run:'Optional easy walk or mobility' }
};

let template = null;
let viewedDate = null;
let currentRecur = { lift:false, run:false };
let currentItems = [];

/* ---------- dates ---------- */
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function fromISO(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function daysBetween(a,b){ return Math.round((fromISO(b)-fromISO(a))/86400000); }
function weekdayMonFirst(iso){ const day=fromISO(iso).getDay(); return day===0?6:day-1; }
function weekdayName(iso){ return DAYS[weekdayMonFirst(iso)]; }
function mondayOf(iso){ return addDays(iso, -weekdayMonFirst(iso)); }

/* ---------- storage ---------- */
const useLocalFallback = (typeof window.storage === 'undefined');
async function getJSON(key){
  try{
    if(useLocalFallback){
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    }
    const r = await window.storage.get(key,false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function setJSON(key,val){
  try{
    if(useLocalFallback){ localStorage.setItem(key, JSON.stringify(val)); return; }
    await window.storage.set(key, JSON.stringify(val), false);
  }catch(e){}
}
async function getRecur(date){ return await getJSON('recurlog:'+date) || { lift:false, run:false }; }
async function setRecur(date, val){ await setJSON('recurlog:'+date, val); }
async function getItems(date){ return await getJSON('items:'+date) || []; }
async function setItems(date, arr){ await setJSON('items:'+date, arr); }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function loadDay(date){
  currentRecur = await getRecur(date);
  currentItems = await getItems(date);
}

async function loadAll(){
  template = await getJSON('template') || structuredClone(DEFAULT_TEMPLATE);
  await setJSON('template', template);
  viewedDate = todayISO();
  await loadDay(viewedDate);
  await render();
}

/* ---------- render ---------- */
async function render(){
  const gen = ++renderGen;
  renderDateHead();
  await renderWeekStrip(gen);
  renderList(gen);
}

function relativeLabel(date){
  const diff = daysBetween(todayISO(), date); // positive = future, negative = past
  if(diff===0) return {text:'Today', cls:'now'};
  if(diff===1) return {text:'Tomorrow', cls:'near'};
  if(diff===-1) return {text:'Yesterday', cls:'near'};
  if(diff>1 && diff<7) return {text:`In ${diff} days`, cls:'near'};
  if(diff<-1 && diff>-7) return {text:`${-diff} days ago`, cls:'near'};
  if(Math.abs(diff)>=7 && Math.abs(diff)<31){
    const w = Math.round(Math.abs(diff)/7);
    return {text: diff>0 ? `In ${w} week${w>1?'s':''}` : `${w} week${w>1?'s':''} ago`, cls:'near'};
  }
  return null; // far past/future — the date itself already shows correctly, no relative tag needed
}

function renderDateHead(){
  const d = fromISO(viewedDate);
  document.getElementById('dowLabel').textContent = d.toLocaleDateString('en-US',{weekday:'long'});
  document.getElementById('fullLabel').textContent = d.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'}).toUpperCase();
  const tag = document.getElementById('relTag');
  const rel = relativeLabel(viewedDate);
  if(rel){ tag.style.display='inline-block'; tag.textContent=rel.text; tag.className='relTag '+rel.cls; }
  else { tag.style.display='none'; }
  document.getElementById('jumpToday').style.display = viewedDate===todayISO() ? 'none' : 'inline-block';
}

let renderGen = 0;

async function renderWeekStrip(gen){
  const monday = mondayOf(viewedDate);
  const dates = Array.from({length:7}, (_,i) => addDays(monday,i));
  const itemLists = await Promise.all(dates.map(d => d===viewedDate ? Promise.resolve(currentItems) : getItems(d)));
  if(gen!==renderGen) return; // a newer render started while we were waiting — drop this one

  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  dates.forEach((date, i) => {
    const dayName = DAYS[i];
    const tpl = template[dayName];
    const chip = document.createElement('div');
    chip.className = 'daychip' + (date===viewedDate ? ' sel' : '');
    chip.onclick = () => { goToDate(date); };
    const marks = [];
    if(tpl.lift && tpl.lift!=='Rest') marks.push('<span class="dotk dot-lift"></span>');
    if(tpl.run && tpl.run.trim()) marks.push('<span class="dotk dot-run"></span>');
    if(itemLists[i].length) marks.push('<span class="dotk dot-note"></span>');
    chip.innerHTML = `
      <div class="cl">${dayName.slice(0,1)}</div>
      <div class="cn">${fromISO(date).getDate()}</div>
      <div class="marks">${marks.join('')}</div>
    `;
    strip.appendChild(chip);
  });
}

function renderList(gen){
  if(gen!==renderGen) return; // a newer render started — drop this one
  const dayName = weekdayName(viewedDate);
  const tpl = template[dayName];

  const list = document.getElementById('list');
  list.innerHTML = '';

  const rows = [];
  if(tpl.lift && tpl.lift!=='Rest') rows.push({recurring:true, kind:'lift', title:tpl.lift, done:currentRecur.lift});
  if(tpl.run && tpl.run.trim()) rows.push({recurring:true, kind:'run', title:tpl.run, done:currentRecur.run});
  currentItems.forEach(it => rows.push({recurring:false, kind:it.type, title:it.text, done:it.done, id:it.id}));

  if(rows.length===0){
    list.innerHTML = '<div class="empty">Nothing here yet. Tap + to add a task or note.</div>';
  } else {
    rows.forEach(row => list.appendChild(buildRow(row)));
  }
  updateProgressFromDOM();
}

function buildRow(row){
  const el = document.createElement('div');
  const isCustomTodo = !row.recurring && row.kind==='todo';
  el.className = 'item' + (isCustomTodo ? ' indent' : '');

  if(row.kind==='note'){
    const icon = document.createElement('div');
    icon.className = 'noteicon';
    icon.textContent = '✎';
    el.appendChild(icon);
  } else {
    const btn = document.createElement('div');
    btn.className = 'checkbtn';
    btn.setAttribute('role', 'button');
    btn.innerHTML = `<span class="checkbox${row.done ? ' on' : ''}">${row.done ? '✓' : ''}</span>`;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      // Optimistic flip — updates instantly and stays put; no re-fetch to race against
      const box = btn.querySelector('.checkbox');
      const nowOn = !box.classList.contains('on');
      box.classList.toggle('on', nowOn);
      box.textContent = nowOn ? '✓' : '';
      updateProgressFromDOM();
      if(row.recurring) toggleRecur(row.kind);
      else toggleItem(row.id);
    });
    el.appendChild(btn);
  }

  const body = document.createElement('div');
  body.className = 'itembody';
  const titleClass = row.kind==='note' ? 'itemtitle notetext' : ('itemtitle' + (row.done ? ' struck' : ''));
  const dotClass = row.kind==='lift' ? 'dot-lift' : row.kind==='run' ? 'dot-run' : row.kind==='note' ? 'dot-note' : 'dot-todo';
  const tagText = row.recurring ? (row.kind==='lift' ? 'Lift · repeats weekly' : 'Run · repeats weekly') : (row.kind==='note' ? 'Note' : 'Todo');
  body.innerHTML = `
    <div class="${titleClass}">${escapeHtml(row.title)}</div>
    <div class="itemtag"><span class="dotk ${dotClass}"></span>${tagText}</div>
  `;
  if(!row.recurring) body.onclick = () => openEdit(row);
  el.appendChild(body);

  if(!row.recurring){
    const del = document.createElement('button');
    del.className = 'delbtn'; del.textContent='×';
    del.onclick = () => deleteItem(row.id);
    el.appendChild(del);
  }
  return el;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function updateProgressFromDOM(){
  const boxes = document.querySelectorAll('#list .checkbox');
  const total = boxes.length;
  const done = document.querySelectorAll('#list .checkbox.on').length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = total ? `${done} of ${total} done` : 'Nothing to check off';
}

/* ---------- actions ---------- */
async function toggleRecur(kind){
  currentRecur[kind] = !currentRecur[kind];
  setRecur(viewedDate, currentRecur);
}
async function toggleItem(id){
  const it = currentItems.find(x => x.id===id);
  if(it) it.done = !it.done;
  setItems(viewedDate, currentItems);
}
async function deleteItem(id){
  currentItems = currentItems.filter(x => x.id!==id);
  setItems(viewedDate, currentItems);
  renderList(renderGen);
  await renderWeekStrip(renderGen);
}
async function addItem(text, type){
  if(!text.trim()) return;
  currentItems.push({ id:newId(), text:text.trim(), type, done:false });
  setItems(viewedDate, currentItems);
  renderList(renderGen);
  await renderWeekStrip(renderGen);
}

/* ---------- nav ---------- */
async function goToDate(date){
  viewedDate = date;
  await loadDay(date);
  await render();
}
document.getElementById('prevDay').onclick = () => goToDate(addDays(viewedDate,-1));
document.getElementById('nextDay').onclick = () => goToDate(addDays(viewedDate,1));
document.getElementById('jumpToday').onclick = () => goToDate(todayISO());

/* ---------- add modal ---------- */
let addType = 'todo';
document.getElementById('addFab').onclick = () => {
  document.getElementById('addDateLabel').textContent = fromISO(viewedDate).toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
  document.getElementById('addText').value = '';
  addType = 'todo';
  document.getElementById('chipTodo').classList.add('sel');
  document.getElementById('chipNote').classList.remove('sel');
  document.getElementById('addOverlay').classList.add('show');
};
document.getElementById('closeAdd').onclick = () => document.getElementById('addOverlay').classList.remove('show');
document.getElementById('chipTodo').onclick = () => { addType='todo'; document.getElementById('chipTodo').classList.add('sel'); document.getElementById('chipNote').classList.remove('sel'); };
document.getElementById('chipNote').onclick = () => { addType='note'; document.getElementById('chipNote').classList.add('sel'); document.getElementById('chipTodo').classList.remove('sel'); };
document.getElementById('saveAddBtn').onclick = async () => {
  await addItem(document.getElementById('addText').value, addType);
  document.getElementById('addOverlay').classList.remove('show');
};
document.getElementById('addText').addEventListener('keydown', (e) => {
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('saveAddBtn').click(); }
});

/* ---------- edit modal ---------- */
let editingId = null;
function openEdit(row){
  editingId = row.id;
  document.getElementById('editText').value = row.title;
  document.getElementById('editOverlay').classList.add('show');
}
document.getElementById('closeEdit').onclick = () => document.getElementById('editOverlay').classList.remove('show');
document.getElementById('saveEditBtn').onclick = async () => {
  const it = currentItems.find(x => x.id===editingId);
  if(it) it.text = document.getElementById('editText').value.trim() || it.text;
  setItems(viewedDate, currentItems);
  document.getElementById('editOverlay').classList.remove('show');
  renderList(renderGen);
};
document.getElementById('deleteBtn').onclick = async () => {
  await deleteItem(editingId);
  document.getElementById('editOverlay').classList.remove('show');
};

/* ---------- template editor ---------- */
document.getElementById('editTemplateBtn').onclick = () => {
  const editor = document.getElementById('templateEditor');
  editor.innerHTML = '';
  DAYS.forEach(day => {
    const row = document.createElement('div');
    row.className = 'editor-row';
    const liftSel = document.createElement('select');
    LIFT_TYPES.forEach(lt => { const o=document.createElement('option'); o.value=lt; o.textContent=lt; if(template[day].lift===lt) o.selected=true; liftSel.appendChild(o); });
    liftSel.dataset.day=day; liftSel.dataset.field='lift';
    const runInput = document.createElement('input');
    runInput.type='text'; runInput.placeholder='Run notes (blank = none)'; runInput.value = template[day].run || '';
    runInput.dataset.day=day; runInput.dataset.field='run';
    row.innerHTML = `<div class="ename">${day.slice(0,3)}</div>`;
    row.appendChild(liftSel); row.appendChild(runInput);
    editor.appendChild(row);
  });
  document.getElementById('templateOverlay').classList.add('show');
};
document.getElementById('closeTemplate').onclick = () => document.getElementById('templateOverlay').classList.remove('show');
document.getElementById('saveTemplateBtn').onclick = async () => {
  const editor = document.getElementById('templateEditor');
  editor.querySelectorAll('select, input').forEach(el => { template[el.dataset.day][el.dataset.field] = el.value; });
  await setJSON('template', template);
  document.getElementById('templateOverlay').classList.remove('show');
  await render();
};

[['addOverlay', () => document.getElementById('addOverlay').classList.remove('show')],
 ['editOverlay', () => document.getElementById('editOverlay').classList.remove('show')],
 ['templateOverlay', () => document.getElementById('templateOverlay').classList.remove('show')]
].forEach(([id, fn]) => { document.getElementById(id).addEventListener('click', (e) => { if(e.target.id===id) fn(); }); });

loadAll();
</script>
</body>
</html>
